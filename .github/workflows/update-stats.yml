name: Update GitHub Stats Cards

on:
  schedule:
    # Runs every 2 hours
    - cron: '0 */2 * * *'
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  build-and-update-stats:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Github-Stats
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Generate Cards into stats and user-stats
        run: |
          npm run generate -- --username "${{ github.repository_owner }}" --timezone "Asia/Kolkata" --grace-days 1 --theme "github-dark" --output "./stats"
          npm run generate -- --username "${{ github.repository_owner }}" --timezone "Asia/Kolkata" --grace-days 1 --theme "github-dark" --output "./user-stats"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push Updated SVGs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stats/ user-stats/
          git commit -m "Update profile cards and stats [skip ci]" || exit 0
          git push
