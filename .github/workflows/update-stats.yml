name: Update GitHub Stats Cards

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  build-and-update-stats:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Github-Stats
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Generate Stats Cards
        run: npm run generate -- --username "${{ github.repository_owner }}" --timezone "Asia/Kolkata" --grace-days 1 --theme "github-dark" --output "./stats"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push Updated SVGs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stats/
          git commit -m "Update profile stats and streak cards [skip ci]" || exit 0
          git push
