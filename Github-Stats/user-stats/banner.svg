<svg width="800" height="220" viewBox="0 0 800 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dynamic Glowing Border Gradient -->
    <linearGradient id="bannerBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#10b981;#06b6d4;#58a6ff" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#238636">
        <animate attributeName="stop-color" values="#238636;#6366f1;#ec4899;#238636" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#f78166">
        <animate attributeName="stop-color" values="#f78166;#8b5cf6;#3b82f6;#f78166" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Background Radial Aura -->
    <radialGradient id="bannerAura" cx="80%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bannerAuraLeft" cx="15%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#238636" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .bg { fill: #0d1117; }
    .border-glow { stroke: url(#bannerBorderGrad); stroke-width: 2; }
    .title-text { font: 800 24px 'Plus Jakarta Sans', -apple-system, sans-serif; fill: #ffffff; letter-spacing: -0.5px; }
    .role-badge { font: 700 12px 'Plus Jakarta Sans', -apple-system, sans-serif; fill: #58a6ff; }
    .terminal-code { font: 600 12px 'JetBrains Mono', monospace; fill: #8b949e; }
    .terminal-prompt { font: 700 12px 'JetBrains Mono', monospace; fill: #10b981; }
    .terminal-title { font: 500 11px 'JetBrains Mono', monospace; fill: #8b949e; opacity: 0.8; }
    .stat-chip-title { font: 500 10px 'Plus Jakarta Sans', -apple-system, sans-serif; fill: #8b949e; }
    .stat-chip-val { font: 800 15px 'Plus Jakarta Sans', -apple-system, sans-serif; fill: #ffffff; }
    .status-text { font: 700 10px 'Plus Jakarta Sans', -apple-system, sans-serif; fill: #10b981; letter-spacing: 0.5px; }
    
    @keyframes pulseAura {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }
    .pulsing { animation: pulseAura 4s infinite ease-in-out; }
  </style>

  <!-- Background Base with Rounded Corners -->
  <rect x="1" y="1" width="798" height="218" rx="10" class="bg" />
  <!-- Ambient Glow Orbs -->
  <rect x="1" y="1" width="798" height="218" rx="10" fill="url(#bannerAura)" class="pulsing" />
  <rect x="1" y="1" width="798" height="218" rx="10" fill="url(#bannerAuraLeft)" />
  <!-- Animated Border -->
  <rect x="1" y="1" width="798" height="218" rx="10" class="border-glow" fill="none" />

  <!-- Top macOS Window Header Bar -->
  <g transform="translate(24, 18)">
    <circle cx="0" cy="0" r="5" fill="#ff5f56" />
    <circle cx="16" cy="0" r="5" fill="#ffbd2e" />
    <circle cx="32" cy="0" r="5" fill="#27c93f" />
    <text x="376" y="4" text-anchor="middle" class="terminal-title">github.com/13507-IN • developer.console</text>
  </g>

  <!-- Active Status Pill (Right) -->
  <g transform="translate(640, 10)">
    <rect x="0" y="0" width="136" height="22" rx="11" fill="#10b98115" stroke="#10b98144" stroke-width="1" />
    <circle cx="14" cy="11" r="3.5" fill="#10b981" />
    <text x="24" y="15" class="status-text">BUILDING IN PUBLIC</text>
  </g>

  <!-- Divider Line -->
  <line x1="20" y1="36" x2="780" y2="36" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Main Left Content -->
  <g transform="translate(32, 60)">
    <!-- RPG Class Pill -->
    <rect x="0" y="0" width="auto" height="20" rx="4" fill="#58a6ff1a" />
    <text x="0" y="13" class="role-badge">⚔️ LVL 22 • Async Warlock</text>

    <!-- Main Heading -->
    <text x="0" y="46" class="title-text">Hi, I'm Rishiraj Debnath 👋</text>

    <!-- Terminal Command Line -->
    <g transform="translate(0, 68)">
      <rect x="0" y="0" width="460" height="34" rx="8" fill="rgba(0,0,0,0.35)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="14" y="21" class="terminal-prompt">&gt;_</text>
      <text x="36" y="21" class="terminal-code">git commit -m "empower open-source" &amp;&amp; deploy</text>
      <rect x="382" y="11" width="7" height="13" fill="#58a6ff">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Quick Micro Badges -->
    <g transform="translate(0, 114)">
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8b949e">
        Top Skill: <tspan font-weight="700" fill="#58a6ff">JavaScript</tspan> • Tier: <tspan font-weight="700" fill="#10b981">⭐ Senior Production Engineer</tspan>
      </text>
    </g>
  </g>

  <!-- Right Side KPI Glass Cards -->
  <g transform="translate(520, 56)">
    <!-- Chip 1: Streak -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="248" height="42" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="14" y="26" font-size="16">🔥</text>
      <text x="42" y="18" class="stat-chip-title">CURRENT STREAK</text>
      <text x="42" y="34" class="stat-chip-val">34 Days</text>
      <text x="236" y="26" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8b949e">Max: 44d</text>
    </g>

    <!-- Chip 2: Total Commits -->
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="248" height="42" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="14" y="26" font-size="16">⚡</text>
      <text x="42" y="18" class="stat-chip-title">TOTAL COMMITS</text>
      <text x="42" y="34" class="stat-chip-val">1,422</text>
      <text x="236" y="26" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10b981">Rank: S+</text>
    </g>

    <!-- Chip 3: Dev Equity Worth -->
    <g transform="translate(0, 100)">
      <rect x="0" y="0" width="248" height="42" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="14" y="26" font-size="16">💎</text>
      <text x="42" y="18" class="stat-chip-title">ESTIMATED ASSET EQUITY</text>
      <text x="42" y="34" class="stat-chip-val" fill="#10b981">$66,000</text>
      <text x="236" y="26" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#58a6ff">13 ⭐</text>
    </g>
  </g>
</svg>