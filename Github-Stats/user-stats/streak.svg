<svg width="495" height="195" viewBox="0 0 495 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; rx: 10px; }
    .num-large { font: 700 28px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #c9d1d9; text-anchor: middle; }
    .num-current { font: 700 26px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #c9d1d9; text-anchor: middle; dominant-baseline: central; }
    .label { font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #58a6ff; text-anchor: middle; }
    .label-current { font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #388bfd; text-anchor: middle; }
    .subtext { font: 400 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #8b949e; text-anchor: middle; }
    .divider { stroke: #30363d; stroke-width: 1px; opacity: 0.7; }
    .ring-bg { stroke: #21262d; stroke-width: 4.5px; fill: none; }
    .ring-progress { stroke: #388bfd; stroke-width: 4.5px; stroke-linecap: round; fill: none; transform: rotate(-90deg); transform-origin: 0px 74px; transition: stroke-dashoffset 0.8s ease; }
    .flame { fill: #f78166; filter: drop-shadow(0px 0px 4px #f7816688); }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    .flame-anim { animation: pulse 2.5s infinite ease-in-out; transform-origin: 0px 26px; }
  </style>

  <!-- Background Card -->
  <rect x="0.5" y="0.5" width="494" height="194" class="bg" />

  <!-- Left Column: Total Contributions -->
  <g transform="translate(100, 0)">
    <text x="0" y="74" class="num-large">1,656</text>
    <text x="0" y="106" class="label">Total Contributions</text>
    <text x="0" y="128" class="subtext">Jun 20, 2024 - Present</text>
  </g>

  <!-- Vertical Divider 1 -->
  <line x1="185" y1="35" x2="185" y2="155" class="divider" />

  <!-- Center Column: Current Streak with Flame & Circular Ring -->
  <g transform="translate(247, 0)">
    <!-- Flame Icon -->
    <g class="flame-anim">
      <path class="flame" transform="translate(-9, 16) scale(0.9)" d="M9.8 1.4c-.4.7-.6 1.6-.5 2.5.3 1.2 1.1 2.2 1.4 3.4.4 1.5.1 3.2-.8 4.4-.9 1.2-2.3 1.9-3.7 2-1.7.1-3.4-.8-4.3-2.2-.6-1-.8-2.3-.5-3.5.1-.4.3-.8.6-1.1.2-.2.6-.1.6.2 0 1 .3 2 1 2.7.5.5 1.3.8 2 .6.5-.1.9-.4 1.1-.9.3-.7.2-1.5-.1-2.2-.3-.8-.8-1.5-1.2-2.3-.6-1.2-.8-2.6-.5-3.9.1-.3.4-.6.7-.4.6.4 1.2 1 1.7 1.6 1.1 1.3 1.7 3 1.6 4.7 0 .3.4.5.6.3.8-.9 1.2-2.1 1.2-3.3 0-.7-.2-1.5-.6-2.1-.2-.3.1-.7.4-.5.4.3.7.6 1 1z" />
    </g>

    <!-- Ring Background -->
    <circle cx="0" cy="74" r="36" class="ring-bg" />
    <!-- Ring Progress -->
    <circle cx="0" cy="74" r="36" class="ring-progress" stroke-dasharray="226.2" stroke-dashoffset="82.25454545454545" />

    <!-- Current Streak Number Inside Ring -->
    <text x="0" y="75" class="num-current">28</text>

    <!-- Label & Range -->
    <text x="0" y="130" class="label-current">Current Streak</text>
    <text x="0" y="152" class="subtext">Oct 23 - Nov 20 (Pending today)</text>
  </g>

  <!-- Vertical Divider 2 -->
  <line x1="310" y1="35" x2="310" y2="155" class="divider" />

  <!-- Right Column: Longest Streak -->
  <g transform="translate(395, 0)">
    <text x="0" y="74" class="num-large">44</text>
    <text x="0" y="106" class="label">Longest Streak</text>
    <text x="0" y="128" class="subtext">Jan 22 - Mar 12</text>
  </g>
</svg>